{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Entregadores</h3>
  <a href="{{ url_for('novo_entregador') }}" class="btn btn-primary btn-sm">Novo Entregador</a>
</div>

<table class="table table-bordered table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Nome</th>
      <th>WhatsApp</th>
      <th>Link Avaliação</th>
    </tr>
  </thead>
  <tbody>
    {% for e in entregadores %}
    <tr>
      <td>{{ e.id }}</td>
      <td>{{ e.nome }}</td>
      <td>{{ e.telefone_whatsapp }}</td>
      <td>{{ e.link_avaliacao_base or '-' }}</td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
