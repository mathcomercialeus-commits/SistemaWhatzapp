{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Mensagens Modelo</h3>
  <a href="{{ url_for('nova_mensagem') }}" class="btn btn-primary btn-sm">Nova Mensagem</a>
</div>

<table class="table table-bordered table-striped">
  <thead>
    <tr>
      <th>ID</th>
      <th>Título</th>
      <th>Corpo</th>
    </tr>
  </thead>
  <tbody>
    {% for m in mensagens %}
    <tr>
      <td>{{ m.id }}</td>
      <td>{{ m.titulo }}</td>
      <td><pre style="white-space: pre-wrap;">{{ m.corpo_texto }}</pre></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
