<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>Sistema WhatsApp Entregas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    >

    <style>
      body {
        min-height: 100vh;
        background: radial-gradient(circle at top left, #00ffef 0, #002033 40%, #000 100%);
        color: #f5f5f5;
      }

      .navbar {
        background: rgba(0, 0, 0, 0.75) !important;
        backdrop-filter: blur(10px);
      }

      .card-glass {
        background: rgba(0, 0, 0, 0.70);
        border-radius: 18px;
        border: 1px solid rgba(0, 255, 239, 0.25);
        box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
      }

      .btn-primary, .btn-success {
        background: linear-gradient(135deg, #00ffef, #00b4a8);
        border: none;
        color: #001218;
        font-weight: 600;
      }

      .btn-primary:hover, .btn-success:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
      }

      a, .nav-link {
        color: #00ffef;
      }
      a:hover, .nav-link:hover {
        color: #7fffee;
      }

      .page-title {
        font-weight: 700;
        letter-spacing: 0.03em;
      }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark mb-4">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">DuLima Entregas</a>
    <div class="d-flex">
        {% if session.get('user_name') %}
        <span class="navbar-text me-3">
            {{ session.get('user_name') }} ({{ session.get('user_role') }})
        </span>
        <a class="btn btn-outline-light btn-sm" href="{{ url_for('logout') }}">Sair</a>
        {% endif %}
    </div>
  </div>
</nav>

<div class="container pb-4">
