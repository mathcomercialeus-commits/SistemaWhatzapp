{% extends "base.html" %}
{% block content %}
<h3>Nova Mensagem Modelo</h3>
<p>Você pode usar as variáveis: <code>{{'{{nome_cliente}}'}}</code>, <code>{{'{{nome_entregador}}'}}</code>, <code>{{'{{link_avaliacao}}'}}</code></p>

<form method="post">
  <div class="mb-3">
    <label class="form-label">Título</label>
    <input type="text" name="titulo" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Corpo da Mensagem</label>
    <textarea name="corpo_texto" class="form-control" rows="5" required></textarea>
  </div>
  <button type="submit" class="btn btn-success">Salvar</button>
</form>
{% endblock %}
