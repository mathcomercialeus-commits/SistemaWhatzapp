{% extends "base.html" %}
{% block content %}
<h3>Novo Entregador</h3>
<form method="post">
  <div class="mb-3">
    <label class="form-label">Nome</label>
    <input type="text" name="nome" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Telefone WhatsApp (ex: +5592999999999)</label>
    <input type="text" name="telefone" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Link de Avaliação (opcional)</label>
    <input type="text" name="link_avaliacao_base" class="form-control">
  </div>
  <button type="submit" class="btn btn-success">Salvar</button>
</form>
{% endblock %}
